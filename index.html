<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Claude</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap');
:root{--bg:#0a0a0a;--sur:#111;--bdr:#1e1e1e;--txt:#e8e8e8;--mut:#555;--acc:#c8f542;--acc2:#42f5a7;--rec:#ff6b35;--wak:#a78bfa}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Mono',monospace;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{z-index:10;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bdr)}
.logo{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--acc);cursor:pointer}
#pill{font-size:10px;padding:4px 10px;border-radius:20px;border:1px solid var(--bdr);color:var(--mut);transition:all .3s}
#pill.waiting{border-color:var(--wak);color:var(--wak)}
#pill.listening{border-color:var(--rec);color:var(--rec)}
#pill.thinking{border-color:var(--acc2);color:var(--acc2)}
#pill.speaking{border-color:var(--acc);color:var(--acc)}
#setup{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:400px;border:1px solid var(--bdr);border-radius:16px;padding:32px;background:var(--sur)}
.card h2{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;margin-bottom:8px;color:var(--acc)}
.card p{font-size:12px;color:var(--mut);margin-bottom:20px;line-height:1.7}
.card input{width:100%;background:var(--bg);border:1px solid var(--bdr);border-radius:8px;padding:12px 14px;color:var(--txt);font-family:'DM Mono',monospace;font-size:13px;outline:none;margin-bottom:12px;transition:border-color .2s}
.card input:focus{border-color:var(--acc)}
.hint{font-size:11px;color:var(--mut);margin-bottom:16px}
#connect-btn{width:100%;background:var(--acc);color:#000;border:none;border-radius:8px;padding:13px;font-family:'Syne',sans-serif;font-size:13px;font-weight:700;cursor:pointer}
main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;z-index:1}
#orb-wrap{display:flex;flex-direction:column;align-items:center;padding:28px 20px 12px;gap:14px;flex-shrink:0}
#orb{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#2a2a2a,#0f0f0f);border:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .4s,box-shadow .4s;position:relative;-webkit-tap-highlight-color:transparent}
#orb.waiting{border-color:rgba(167,139,250,.3);box-shadow:0 0 30px rgba(167,139,250,.08)}
#orb.wake{border-color:var(--wak);box-shadow:0 0 50px rgba(167,139,250,.3);animation:pop .4s}
#orb.listening{border-color:var(--rec);box-shadow:0 0 50px rgba(255,107,53,.3);animation:breathe 2s ease-in-out infinite}
#orb.thinking{border-color:var(--acc2);box-shadow:0 0 40px rgba(66,245,167,.2);animation:spin 1.5s ease-in-out infinite alternate}
#orb.speaking{border-color:var(--acc);box-shadow:0 0 50px rgba(200,245,66,.25);animation:breathe2 .8s ease-in-out infinite alternate}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes breathe2{from{transform:scale(1)}to{transform:scale(1.04)}}
#bars{display:flex;align-items:center;gap:4px;height:40px;opacity:0;transition:opacity .3s}
#orb.listening #bars,#orb.speaking #bars{opacity:1}
#bars .b{width:4px;border-radius:2px;background:var(--rec);height:6px;animation:bw .7s ease-in-out infinite}
#orb.speaking #bars .b{background:var(--acc)}
@keyframes bw{0%,100%{height:4px}50%{height:28px}}
#orb-icon{position:absolute;color:var(--mut);transition:opacity .3s}
#orb.listening #orb-icon,#orb.speaking #orb-icon{opacity:0}
#state-lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);text-align:center}
#interim{font-size:14px;color:var(--mut);text-align:center;padding:0 20px;min-height:20px;font-style:italic}
#interim.on{color:var(--txt)}
#wake-hint{font-size:10px;color:var(--mut);opacity:.6;letter-spacing:.08em}
#msgs{flex:1;overflow-y:auto;padding:12px 16px 6px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.msg{max-width:86%;animation:up .3s ease}.msg.u{align-self:flex-end}.msg.c{align-self:flex-start}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.mlbl{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:4px;padding:0 4px}
.msg.u .mlbl{text-align:right;color:var(--acc)}.msg.c .mlbl{color:var(--acc2)}
.mbub{padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.65}
.msg.u .mbub{background:rgba(200,245,66,.07);border:1px solid rgba(200,245,66,.12);border-radius:12px 4px 12px 12px}
.msg.c .mbub{background:var(--sur);border:1px solid var(--bdr);border-radius:4px 12px 12px 12px}
.dots span{display:inline-block;width:4px;height:4px;background:var(--mut);border-radius:50%;margin:0 2px;animation:db 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes db{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}
#bottom{padding:10px 16px 20px;border-top:1px solid var(--bdr);display:flex;align-items:center;gap:10px}
.iw{flex:1;display:flex;align-items:center;gap:8px;background:var(--sur);border:1px solid var(--bdr);border-radius:28px;padding:8px 14px}
#ti{flex:1;background:transparent;border:none;outline:none;color:var(--txt);font-family:'DM Mono',monospace;font-size:13px;resize:none;max-height:80px}
#ti::placeholder{color:var(--mut)}
#sb{width:28px;height:28px;border-radius:50%;border:none;background:var(--acc);color:#000;cursor:pointer;display:flex;align-items:center;justify-content:center}
#sb:disabled{opacity:.25;cursor:default}
.tg{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.tsw{width:30px;height:17px;border-radius:9px;background:var(--bdr);position:relative;transition:background .2s}
.tsw.on{background:var(--acc2)}
.tsw::after{content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:transform .2s}
.tsw.on::after{transform:translateX(13px)}
</style>
</head>
<body>
<div id="setup"><div class="card">
<h2>Voice Claude</h2>
<p>Say <strong style="color:var(--wak)">Hey Claude</strong> to activate, then speak. Fully hands-free.</p>
<input type="password" id="key-input" placeholder="sk-ant-api03-..." autocomplete="off" />
<div class="hint">Saved locally on this device only.</div>
<button id="connect-btn">Start Listening</button>
</div></div>
<header><div class="logo" id="logo">Voice Claude</div><div id="pill">idle</div></header>
<main><div id="orb-wrap">
<div id="orb" class="idle"><div id="orb-icon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10a7 7 0 0014 0"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg></div><div id="bars"><div class="b"></div><div class="b"></div><div class="b"></div><div class="b"></div><div class="b"></div></div></div>
<div id="state-lbl">tap orb or say hey claude</div>
<div id="interim"></div>
<div id="wake-hint">always listening for wake word</div>
</div><div id="msgs"></div></main>
<div id="bottom"><div class="iw"><textarea id="ti" rows="1" placeholder="or type here..."></textarea><button id="sb" disabled><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg></button></div><div class="tg" id="tg-btn"><div class="tsw on" id="tsw"></div><span id="tsl">&#128266;</span></div></div>
<script>
var WAKE=["hey claude","hey cloud","hey claud","ok claude"];
var SIL=1800,MAX=15000;
var key=localStorage.getItem("vc_key")||"",hist=[],tts=true,utt=null;
var wr=null,lr=null,appState="idle",st=null,lt=null,acc="";
document.getElementById("connect-btn").addEventListener("click",function(){
  var k=document.getElementById("key-input").value.trim();
  if(!k||!k.startsWith("sk-")){alert("Enter a valid Anthropic API key starting with sk-");return;}
  localStorage.setItem("vc_key",k);key=k;
  document.getElementById("setup").style.display="none";
  init();
});
document.getElementById("key-input").addEventListener("keydown",function(e){if(e.key==="Enter")document.getElementById("connect-btn").click();});
document.getElementById("tg-btn").addEventListener("click",function(){
  tts=!tts;
  document.getElementById("tsw").className="tsw"+(tts?" on":"");
  document.getElementById("tsl").textContent=tts?String.fromCodePoint(128266):String.fromCodePoint(128263);
  if(!tts&&window.speechSynthesis)speechSynthesis.cancel();
});
document.getElementById("ti").addEventListener("input",function(){document.getElementById("sb").disabled=!this.value.trim();});
document.getElementById("ti").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendText();}});
document.getElementById("sb").addEventListener("click",sendText);
document.getElementById("orb").addEventListener("click",manualActivate);
document.getElementById("logo").addEventListener("dblclick",function(){if(confirm("Clear?")){hist=[];document.getElementById("msgs").innerHTML="";}});
document.addEventListener("visibilitychange",function(){if(!window.speechSynthesis)return;if(document.hidden)speechSynthesis.pause();else speechSynthesis.resume();});
if(key){document.getElementById("setup").style.display="none";init();}
function init(){var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){setP("ready","type only - use Chrome for voice");return;}startWake();}
function setP(cls,txt){var el=document.getElementById("pill");el.className=cls;el.textContent=txt;}
function setOrb(s){appState=s;document.getElementById("orb").className=s;
  var sl=document.getElementById("state-lbl"),wh=document.getElementById("wake-hint");
  var m={waiting:["listening for hey claude","waiting","always listening"],wake:["activated!","wake",""],listening:["listening...","listening",""],thinking:["thinking...","thinking",""],speaking:["speaking...","speaking",""],idle:["tap orb or say hey claude","ready","always listening"]};
  var d=m[s]||["","ready",""];sl.textContent=d[0];setP(d[1],d[1]);wh.textContent=d[2];wh.style.opacity=d[2]?".6":"0";
}
function startWake(){var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  wr=new SR();wr.continuous=true;wr.interimResults=true;wr.lang="en-US";wr.maxAlternatives=3;
  wr.onresult=function(e){if(appState!=="waiting")return;for(var i=e.resultIndex;i<e.results.length;i++)for(var j=0;j<e.results[i].length;j++){var t=e.results[i][j].transcript.toLowerCase().trim();if(WAKE.some(function(w){return t.indexOf(w)>=0;})){onWake();return;}}};  
  wr.onerror=function(e){if(e.error==="not-allowed"){setP("ready","mic denied");return;}setTimeout(function(){if(appState==="waiting")startWake();},1000);};
  wr.onend=function(){if(appState==="waiting")setTimeout(startWake,300);};
  wr.start();setOrb("waiting");
}
function stopWake(){if(wr){try{wr.stop();}catch(e){}wr=null;}}
function onWake(){stopWake();setOrb("wake");tone(440,80);setTimeout(function(){tone(660,120);},100);if(utt&&window.speechSynthesis)speechSynthesis.cancel();setTimeout(startListen,400);}
function manualActivate(){if(appState==="thinking"||appState==="speaking")return;if(appState==="listening"){finalize();return;}stopWake();onWake();}
function startListen(){acc="";setInt("");setOrb("listening");var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  lr=new SR();lr.continuous=true;lr.interimResults=true;lr.lang="en-US";
  lr.onresult=function(e){var interim="";for(var i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal){acc+=e.results[i][0].transcript+" ";rst();}else interim+=e.results[i][0].transcript;}setInt((acc+interim).trim());};
  lr.onerror=function(e){if(e.error==="no-speech"){if(acc.trim())finalize();else{cleanup();startWake();}}};
  lr.onend=function(){if(appState==="listening"){if(acc.trim())finalize();else{cleanup();startWake();}}};
  lr.start();rst();lt=setTimeout(function(){if(appState==="listening")finalize();},MAX);
}
function rst(){clearTimeout(st);if(acc.trim())st=setTimeout(function(){if(appState==="listening")finalize();},SIL);}
function finalize(){clearTimeout(st);clearTimeout(lt);var t=acc.trim();cleanup();if(t){setInt("");sendMsg(t);}else startWake();}
function cleanup(){clearTimeout(st);clearTimeout(lt);if(lr){try{lr.stop();}catch(e){}lr=null;}acc="";}
function setInt(t){var el=document.getElementById("interim");el.textContent=t;el.className=t?"on":"";}
function sendText(){var inp=document.getElementById("ti"),t=inp.value.trim();if(!t)return;inp.value="";document.getElementById("sb").disabled=true;stopWake();cleanup();sendMsg(t);}
function sendMsg(text){setOrb("thinking");addMsg("u",text);hist.push({role:"user",content:text});
  var te=addMsg("c","<div class=\"dots\"><span></span><span></span><span></span></div>",true);
  fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1024,system:"You are Claude, a voice assistant. Keep responses conversational and concise - spoken aloud via TTS. Avoid markdown.",messages:hist})})
  .then(function(r){return r.json();})
  .then(function(d){if(d.error)throw new Error(d.error.message);var rep=d.content[0].text;hist.push({role:"assistant",content:rep});te.querySelector(".mbub").innerHTML=rep.replace(/\n/g,"<br>");if(tts)speak(rep,function(){setOrb("waiting");startWake();});else{setOrb("waiting");startWake();}})
  .catch(function(err){te.querySelector(".mbub").textContent="Error: "+err.message;setOrb("waiting");startWake();});
}
function speak(text,cb){if(!window.speechSynthesis){if(cb)cb();return;}speechSynthesis.cancel();setOrb("speaking");
  var c=text.replace(/[*_`#]/g,"").replace(/\n+/g,". ").trim();
  var u=new SpeechSynthesisUtterance(c);u.rate=1.05;
  var vs=speechSynthesis.getVoices();var pv=vs.find(function(v){return v.name.indexOf("Samantha")>=0||v.name.indexOf("Google US")>=0||v.name.indexOf("Aria")>=0;});
  if(pv)u.voice=pv;u.onend=function(){if(cb)cb();};u.onerror=function(){if(cb)cb();};utt=u;speechSynthesis.speak(u);
}
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=function(){speechSynthesis.getVoices();};
function tone(f,d){try{var c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;o.type="sine";g.gain.setValueAtTime(.08,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d/1000);o.start();o.stop(c.currentTime+d/1000);}catch(e){}}
function addMsg(role,content,isT){var ms=document.getElementById("msgs"),w=document.createElement("div");w.className="msg "+(role==="u"?"u":"c");var l=document.createElement("div");l.className="mlbl";l.textContent=role==="u"?"you":"claude";var b=document.createElement("div");b.className="mbub";b.innerHTML=content;w.appendChild(l);w.appendChild(b);ms.appendChild(w);ms.scrollTop=ms.scrollHeight;return w;}
</script>
</body>
</html>
